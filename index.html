<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paleta de colores</title>
  <!-- ARCHIVO VINCULADO CON CSS -->
  <link rel="stylesheet" href="./css/style.css">

</head>

<body>
  <!-- HEADER: Título y descripción -->
  <header class="header">
    <div class="header-contenido">
      <h1 class="titulo-principal">Paleta de colores</h1>
    </div>   
  </header>




  <!-- CONTENEDOR PRINCIPAL -->
  <main class="contenedor">
    

  <!--SELECTOR PRINCIPAL-->
    <div class="panel-control">

        <h2>Crea una paleta de colores</h2>
    
      <div class="botones-control">
    
        <select id="selector-cantidad"aria-label="Cantidad de colores">
          <option value= "6">6 colores</option>
          <option value= "8">8 colores</option>
          <option value= "9">9 colores</option>
        </select>
    
        <button id="generar-paleta">Generar paleta</button>
        <button id="guardar-paleta">Guardar paleta</button>
    
      </div>
    
    </div>
    
  
    
    <!-- BOX DE COLORES -->
    <section class="contenedor-paleta" id="contenedor-paleta">
      </section>

      <!-- POP UP OCULTO PARA GUARDAR PALETA -->
     <div class="popup oculto" id="popup-guardar">
      <div class="popup-contenido">
        
        <h2>Guardar paleta</h2>
        <label for="nombre-paleta">Nombre de la paleta</label>

        <!-- BOX DE TEXTO GUARDADO -->
        <input
          type="text"
          id="nombre-paleta"
          placeholder="Ej: Paleta de verano"
          >

          <p id="error-nombre" class="error-nombre"></p>
          
          <div class="botones-pop-up">
              <button id="guardar" type="button">Guardar</button>
              <button id="cancelar"tyoe= "buttton">Cancelar</button>
          </div>
      </div>

     </div>

     <!-- TOOLTIP GUARDADO -->
     <div id="mensaje-guardado" class="mensaje-guardado oculto">
      Paleta guardada correctamente
    </div>

    <section class="guardados-recientes">

      <!-- SECCION DE GUARDADOS -->
      <h2>Guardados recientemente</h2>
      <div class="lista-guardados" id="lista-guardados">


      </div>

    </section>
</main>


      

     
  <!-- PIE DE PÁGINA -->
  <footer class="footer">
    <p>Paleta de colores - Ivo Unzaga </p>
  </footer>

  <script src="./js/javascript.js" defer> </script>
</body>
</html>
