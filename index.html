<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paleta de colores</title>
  <!-- ARCHIVO VINCULADO CON CSS -->
  <link rel="stylesheet" href="./css/style.css">

</head>

<body>
  <!-- HEADER: Título y descripción -->
  <header class="header">
    <div class="header-contenido">
      <h1 class="titulo-principal">Paleta de colores</h1>
      <p class="descripcion">Crea una paleta de forma aleatoria</p>
    </div>

    <nav class="nav">
        <a href="#" class="nav-favoritos"> Mis favoritos</a>
    </nav>
  </header>




  <!-- CONTENEDOR PRINCIPAL -->
  <main class="contenedor">
    
  <section class="selector">
    <div class="panel-control">
        <label for="selector-cantidad">Cantidad de colores</label>
    
    <select id="selector-cantidad">
        <option value= "6">6 colores</option>
        <option value= "8">8 colores</option>
        <option value= "9">9 colores</option>
    </select>

      <button id="generar-paleta">Generar paleta</button>
      <button id="guardar-paleta">Guardar paleta</button>
    </div>
  </section>
    
    <!-- BOX DE COLORES -->
    <section class="contenedor-paleta" id="contenedor-paleta">
      </section>

     <div class="popup oculto" id="popup-guardar">
      <div class="popup-contenido">
        
        <h2>Guardar paleta</h2>
        <label for="nombre-paleta">Nombre de la paleta</label>

        <input
          type="text"
          id="nombre-paleta"
          placeholder="Ej: Paleta de verano"
          >
          <div class="botones-pop-up">
              <button id="guardar">Guardar</button>
              <button id="cancelar">Cancelar</button>
          </div>  
      </div>

     </div>

    <section class="guardados-recientes">

      <h2>Guardados recientemente</h2>
      <div class="lista-guarddos" id="lista-guardados">


      </div>

    </section>
</main>


      

     
  <!-- PIE DE PÁGINA -->
  <footer class="footer">
    <p>PALETA DE COLORES </p>
  </footer>

  <script src="./js/javascript.js"> </script>
</body>
</html>
